# 服务端口
port: 8080

# 日志级别
logLevel: info

# Redis配置
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 10
  poolSize: 10
  minIdleConns: 5
  maxIdleConns: 10

# 服务发现配置
discovery:
  enabled: true
  serviceName: "logic"
  heartbeatInterval: 3s
  heartbeatTTL: 10s
  deregisterDelay: 5s
  scanInterval: 10s

# 协议配置
transports:
  - protocol: tcp
    port: 8083
    type: ""
  - protocol: udp
    port: 8084
    type: ""
  - protocol: tcp
    port: 8085
    type: websocket

# 工作池配置
workerPool:
  minWorkers: 128
  maxWorkers: 1000
  queueSize: 500000
  queueSizeThreshold: 10000

# 速率限制配置
rateLimiter:
  rate: 500000
  burst: 1000000
  window: 1s

# 安全配置
security:
  authSecret: "default_secret"
  authRoutes:
    - "getConnections"
    - "broadcast"

# 告警配置
alerts:
  activeConnectionsThreshold: 10000
  failedMessagesThreshold: 100
  processingTimeThreshold: 1000
  redisErrorsThreshold: 10
  queueLengthThreshold: 10000

# 资源限制配置
resources:
  memoryThreshold: 95.0
  cpuThreshold: 95.0
  enableResourceCircuitBreaker: true
