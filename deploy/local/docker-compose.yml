# ============================================================================
# 本地监控栈一键启动（Nacos + Prometheus + Grafana）
# ----------------------------------------------------------------------------
# 启动：docker-compose -f deploy/local/docker-compose.yml up -d
# 停止：docker-compose -f deploy/local/docker-compose.yml down
#
# 端口规划：
#   8848  Nacos 主端口（实例注册/查询 API）
#   8080  Nacos 控制台（http://127.0.0.1:8080/nacos）
#   9091  Prometheus UI（http://127.0.0.1:9091）
#   3000  Grafana UI（http://127.0.0.1:3000，admin/admin）
# ============================================================================

version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: sgate-nacos
    ports:
      - "8848:8848"                          # 主端口（naming/config API）
      - "8080:8080"                          # 控制台
    environment:
      - MODE=standalone                      # 单机模式（Derby 内嵌存储）
      - NACOS_AUTH_ENABLE=false              # 本地开发关闭认证；生产必开并配置 token/密钥
      - JVM_XMS=256m
      - JVM_XMX=512m
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sgate-prometheus
    ports:
      - "9091:9090"                          # 容器内 9090 → 主机 9091（避开 sgate metrics 的 9090）
    volumes:
      - ./prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'   # 数据保留 7 天
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 让容器访问宿主机 sgate

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sgate-grafana
    ports:
      - "3000:3000"                          # Grafana UI
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../k8s/grafana/sgate-dashboard.json:/etc/grafana/provisioning/dashboards/sgate-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin         # 首次登录用户名
      - GF_SECURITY_ADMIN_PASSWORD=admin     # 首次登录密码（生产必改）
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
