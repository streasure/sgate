# ============================================================================
# Prometheus 抓取配置（Windows 本地原生安装版）
# ----------------------------------------------------------------------------
# 作用：告诉 Prometheus 去 sgate 的 :9100/metrics 拉取指标
# 启动方式：
#   prometheus.exe --config.file=e:\sgate\deploy\local\prometheus.yml
#
# 端口说明：
#   - sgate metrics 监听 :9100（见 config.yaml monitoring.prometheus.addr）
#   - Prometheus 使用默认端口 :9090（Grafana 数据源默认指向 http://localhost:9090）
# ============================================================================

global:
  scrape_interval: 5s          # 抓取间隔（按需调整，压测时可降到 1s）
  evaluation_interval: 10s     # 告警规则评估间隔
  external_labels:
    monitor: 'sgate-monitor'

scrape_configs:
  # sgate 网关指标
  - job_name: 'sgate'
    scrape_interval: 5s
    metrics_path: '/metrics'  # 必须与 sgate config.yaml 的 monitoring.prometheus.path 一致
    static_configs:
      - targets: ['127.0.0.1:9100']   # sgate 的 Prometheus 指标端点

  # sgate 健康检查（可选，仅作存活参考）
  - job_name: 'sgate-health'
    metrics_path: '/health'
    static_configs:
      - targets: ['127.0.0.1:8081']   # sgate 的 health 端口（config.yaml 中 port: 8081）
