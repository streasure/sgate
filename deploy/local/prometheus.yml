# ============================================================================
# Prometheus 抓取配置（Windows 本地原生安装版）
# ----------------------------------------------------------------------------
# 作用：告诉 Prometheus 去 sgate 的 :9090/metrics 拉取指标
# 启动方式：
#   prometheus.exe --config.file=e:\sgate\deploy\local\prometheus.yml --web.listen-address=:9091 --storage.tsdb.path=e:\sgate\deploy\local\prometheus-data
# 注意：
#   - Prometheus 自身默认端口 9090 与 sgate metrics 冲突，故用 --web.listen-address=:9091
#   - storage.tsdb.path 必须指向已存在的目录
#   - Windows 下 prometheus.exe 从 https://prometheus.io/download/ 下载
# ============================================================================

global:
  scrape_interval: 5s          # 抓取间隔（按需调整，压测时可降到 1s）
  evaluation_interval: 10s     # 告警规则评估间隔
  external_labels:
    monitor: 'sgate-monitor'

scrape_configs:
  # sgate 网关指标
  - job_name: 'sgate'
    scrape_interval: 5s
    metrics_path: '/metrics'  # 必须与 sgate config.yaml 的 monitoring.prometheus.path 一致
    static_configs:
      - targets: ['127.0.0.1:9090']   # sgate 的 Prometheus 指标端点
        labels:
          service: 'sgate'
          zone: 'default'

  # sgate 健康检查（可选，仅作存活参考）
  - job_name: 'sgate-health'
    metrics_path: '/health'
    static_configs:
      - targets: ['127.0.0.1:8081']   # sgate 的 health 端口（config.yaml 中 port: 8081）
