# ============================================================================
# Nacos 上要导入的 sgate.yaml 配置内容
# ----------------------------------------------------------------------------
# 导入步骤：
#   1. 登录 Nacos 控制台（http://127.0.0.1:68848/nacos）
#   2. 配置管理 → 配置列表 → 新建配置
#   3. Data ID:   sgate.yaml
#      Group:      DEFAULT_GROUP
#      配置格式:   YAML
#      配置内容:   粘贴本文件全部内容
#   4. 发布
#   5. sgate 启动后会从 Nacos 拉取此配置并热加载
#
# 注意：本配置已去掉 configCenter 部分（避免循环依赖——Nacos 上的配置不再指 Nacos）
#       sgate 本地 config.yaml 仅保留 configCenter 作为引导配置
# ============================================================================

# --- 基础 ---
port: 8081                    # HTTP 监控端口（health/stats/metrics）— Nacos 占用 8080，避让到 8081
logLevel: info                # 日志级别：debug | info | warn | error
zone: ""                      # zone 标识，多机房部署时设 bj01/sh02

# --- 服务发现 ---
# 启用后从 Nacos 自动发现 logic server；关闭则用静态 localhost:50052
discovery:
  enabled: true
  serviceName: "logic"
  zone: ""

# --- 监听协议 ---
transports:
  - protocol: tcp
    port: 48080               # TCP 接入端口
    type: ""

# --- gRPC ---
grpc:
  port: 50051

# --- 过载保护 ---
protection:
  memoryThreshold: 95.0       # 内存水位 %，超过触发过载丢弃
  cpuThreshold: 95.0          # CPU 水位 %，超过触发过载丢弃

# --- 安全防护 ---
security:
  enabled: true
  whitelist: []               # IP 白名单（空=不限制）
  blacklist: []               # IP 黑名单

# --- TLS ---
tls:
  enabled: false
  certFile: ""
  keyFile: ""

# --- 集群 ---
# 节点注册为 Nacos 临时实例（sgate-gateway 服务），同 zone 内按 ip:port 排序选举 Leader
cluster:
  enabled: true
  nodeID: ""                  # 留空=hostname-pid

# --- 负载均衡 ---
balancer:
  algorithm: "roundRobin"    # roundRobin | weighted | leastConn | consistent

# --- JWT 鉴权 ---
jwtAuth:
  enabled: false
  secret: "change-me"
  skipRoutes:
    - "handshake"
    - "login"

# --- 灰度发布 ---
canary:
  enabled: false
  percent: 0
  headers: {}
  userIDs: []
  targetRoute: ""

# --- 流量镜像 ---
trafficMirror:
  enabled: false
  percent: 0
  targetAddr: ""

# --- OpenTelemetry / Zipkin ---
otelTracer:
  enabled: false
  endpoint: "http://127.0.0.1:9411/api/v2/spans"

# --- 告警 webhook ---
alert:
  enabled: false
  webhooks:
    - name: "wecom-bot"
      url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"
      type: "wecom"
      secret: ""
    - name: "dingtalk-bot"
      url: "https://oapi.dingtalk.com/robot/send?access_token=xxx"
      type: "dingtalk"
      secret: ""

# --- 降级 ---
degradation:
  enabled: false
  rules:
    - route: "high_failure_route"
      errorThreshold: 0.5
      fallbackData: ""

# --- 监控接入（可插拔）---
# 关闭时 sgate 单体也能正常运行（不暴露 /metrics）
# 端口规划（都用默认端口）：
#   sgate metrics :9100  ← 让出 9090 给 Prometheus
#   Prometheus    :9090  ← Prometheus 自身默认
#   Grafana       :3000  ← Grafana 自身默认
monitoring:
  prometheus:
    enabled: true              # true=启动 /metrics 端点；false=单体模式
    addr: ":9100"             # sgate metrics 监听地址（让出 9090 给 Prometheus）
    path: "/metrics"          # 指标路径
