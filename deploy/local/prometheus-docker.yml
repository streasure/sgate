# Prometheus scrape config for the Docker Compose monitoring stack.
# 127.0.0.1 inside this container is the Prometheus container itself.
global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    monitor: 'sgate-monitor'

scrape_configs:
  - job_name: 'sgate'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'sgate-health'
    metrics_path: '/health'
    static_configs:
      - targets: ['host.docker.internal:8081']
