# 单机默认配置：只写环境项（身份/端口/etcd/特性开关/环境差异覆盖）。
# 「基本不改」的数值（shardCount、帧尺寸、限流默认、GOGC 等）见
# internal/config/defaults.go + ApplyRuntimeDefaults，勿在本文件重复。
# 目录：cluster/ 集群实例 · bench/ 压测 · log/ 日志
httpPort: 8081
belong: "default"       # 所属应用/团队标识，与 serverType+zone+serverId 唯一确定一个服务
serverId: "gateway-1"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]

discovery:
  enabled: true
  registerSelf: true   # standalone模式下向etcd注册网关连接信息（供loginserver发现）

transports:
  - protocol: tcp
    port: 48080
  - protocol: tcp
    port: 48081
    type: websocket

grpc:
  port: 50051
  windowSize: 67108864   # 64MB 流控窗口（历史压测口径，覆盖默认 512KB）

monitoring:
  pprofAddr: "127.0.0.1:6060"
  disableMetricsLog: true   # 线上关闭每秒 metrics 日志；压测/排障可改 false

configCenter:
  enabled: false

cluster:
  enabled: false

protection:
  cpuThreshold: 92          # 覆盖默认 90
  dropOnOverload: true      # bool 零值为 false，需显式开启
  connIdleTimeout: "30s"    # 覆盖默认 5m

security:
  enabled: true
  # 封禁共享存储：多网关实例通过 Redis 共享封禁表；enabled=false 仅进程内存。
  # keyPrefix/timeouts/syncInterval/events 等非环境项默认见 defaults.go。
  banRedis:
    enabled: false
    address: "127.0.0.1:6379"
    # required: true        # 多实例生产建议：连不上拒绝启动
    # eventsEnabled: true   # 默认开（Pub/Sub 秒级踢人）；显式 false 才关
  rateLimit:
    enabled: true       # 出口 IP 后面有多台机器（NAT/CGNAT）时 per-IP 限额共享，按需调大 maxTokens 或配白名单
  circuitBreaker:
    enabled: false

# LoginGate loginKey 校验：true=必须过 loginserver（空 key 也不能绕过）；false=永远放行（压测）
loginValidation:
  enabled: false

waf:
  enabled: false

pipeline:
  asyncEnabled: false      # A/B 实测：同步 498K > 异步 482K（异步另有 3% 队列丢弃），默认同步
  workerQueueSize: 262144  # 覆盖默认 65536（高吞吐建议）；仅 asyncEnabled=true 时生效

# 管理端 /admin/* Bearer token；空 = 关闭（fail-closed）
admin:
  token: ""

# WASM 运行时：启用后启动时加载模块，供 filterChain 中的 wasm-filter 引用（module 名）。
# 加载失败会令组件 Init 失败并终止启动（fail-fast，不静默降级）。
# wasmRuntime:
#   enabled: true
#   modules:
#     - name: "my-filter"
#       path: "./wasm/my-filter.wasm"
