port: 8081
logLevel: warn
belong: "default"       # 所属应用/团队标识，与 serverType+zone+serverId 唯一确定一个服务
serverId: "gateway-1"
serverType: "Gateway"
zone: "default"

etcd:
  enabled: true
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

discovery:
  enabled: true
  serviceName: "logic"
  zone: "default"
  heartbeatInterval: 3s
  heartbeatTTL: 10s
  registerSelf: true   # standalone模式下向etcd注册网关连接信息（供loginserver发现）

# logic server type for etcd service discovery (ServiceID = logicServerType + ":" + zone)
logicServerType: "Logic"

transports:
  - protocol: tcp
    port: 48080
  - protocol: tcp
    port: 48081
    type: websocket

grpc:
  port: 50051
  windowSize: 67108864

monitoring:
  pprofAddr: ""
  prometheus:
    enabled: false
    addr: ":9101"
    path: "/metrics"
    prefix: "app"
  maxMessageSize: 8388608

configCenter:
  enabled: false

cluster:
  enabled: false
  mode: "standalone"   # standalone: 单体模式（默认）, cluster: 集群协作模式

stream:
  shardCount: 96
  sendChannelSize: 1048576
  receiveBatchSize: 128

protection:
  maxFrameSize: 4194304
  maxFrameBufSize: 4194304
  maxWSFrameSize: 4194304
  maxWSBufferSize: 4194304
  maxConnections: 0            # 网关最大总连接数，0=不限制
  maxConnectionsPerIP: 0       # 单 IP 最大连接数，0=不限制
  maxMessagesPerConn: 0        # 单连接每秒最大消息数，0=不限制（防异常连接占满队列）
  memoryThreshold: 92
  cpuThreshold: 92
  dropOnOverload: true
  checkIntervalMs: 200
  wsHeartbeatTimeout: 60
  wsCheckInterval: 30
  connCheckInterval: "5m"
  connIdleTimeout: "30s"
  # Authentication is logic-owned. Only these command IDs are accepted until
  # logic replies with a non-empty StreamData.user_key.
  preAuthCommands: [1000001]

security:
  enabled: true
  rateLimit:
    enabled: true
    maxTokens: 1000000
    tokenRefresh: "1s"
  circuitBreaker:
    enabled: false

waf:
  enabled: false
