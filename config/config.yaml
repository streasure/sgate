httpPort: 8081
belong: "default"       # 所属应用/团队标识，与 serverType+zone+serverId 唯一确定一个服务
serverId: "gateway-1"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

discovery:
  enabled: true
  serviceName: "logic"
  zone: "default"
  registerSelf: true   # standalone模式下向etcd注册网关连接信息（供loginserver发现）

transports:
  - protocol: tcp
    port: 48080
  - protocol: tcp
    port: 48081
    type: websocket

grpc:
  port: 50051
  windowSize: 67108864

monitoring:
  pprofAddr: ""
  prometheus:
    enabled: false
    addr: ":9101"
    path: "/metrics"
    prefix: "app"
  maxMessageSize: 8388608

configCenter:
  enabled: false

cluster:
  enabled: false
  mode: "standalone"   # standalone: 单体模式（默认）, cluster: 集群协作模式

stream:
  shardCount: 96
  connGroupCount: 4          # gateway→logic 独立 TCP 连接组数（默认 4），每个组承载 shardCount/N 个 stream
  sendChannelSize: 1048576
  receiveBatchSize: 128
  batchPush: false

protection:
  maxFrameSize: 4194304
  maxFrameBufSize: 4194304
  maxWSFrameSize: 4194304
  maxWSBufferSize: 4194304
  maxConnections: 0            # 网关最大总连接数，0=不限制
  maxConnectionsPerIP: 0       # 单 IP 最大连接数，0=不限制
  maxMessagesPerConn: 0        # 单连接每秒最大消息数，0=不限制（防异常连接占满队列）
  memoryThreshold: 92
  cpuThreshold: 92
  dropOnOverload: true
  checkIntervalMs: 200
  wsHeartbeatTimeout: 60
  wsCheckInterval: 30
  connCheckInterval: "5m"
  connIdleTimeout: "30s"
  # Authentication is logic-owned. Only these command IDs are accepted until
  # logic replies with a non-empty StreamData.user_key.
  preAuthCommands: [1000001]

security:
  enabled: true
  rateLimit:
    enabled: true
    maxTokens: 1000000
    tokenRefresh: "1s"
  circuitBreaker:
    enabled: false

# LoginGate loginKey 校验：true=必须过 loginserver（空 key 也不能绕过）；false=永远放行（压测）
loginValidation:
  enabled: false

waf:
  enabled: false

perf:
  gcPercent: 300           # GOGC：堆增长 300% 时触发 GC（默认 100），高吞吐场景调大减少 GC 频率
  memoryLimitPercent: 80   # 软内存上限 = 机器总内存的 80%，防止单机 OOM

pipeline:
  asyncEnabled: true       # 启用异步 pipeline（worker pool 模式）
  workerShards: 48         # worker 分片数（默认 CPU×4=48），同一连接严格有序
  workerQueueSize: 262144  # 总任务队列大小
