httpPort: 8081
belong: "default"
serverId: "gateway-1"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

discovery:
  enabled: true
  serviceName: "logic"
  zone: "default"
  registerSelf: true

transports:
  - protocol: tcp
    port: 48080
  - protocol: tcp
    port: 48081
    type: websocket

grpc:
  port: 50051
  windowSize: 67108864

monitoring:
  pprofAddr: "127.0.0.1:6060"
  disableTracer: true   # 压测关闭分布式追踪（避免每消息 Span 分配）
  disableMetricsLog: true   # 压测关闭每秒 metrics 日志

configCenter:
  enabled: false

cluster:
  enabled: false
  mode: "standalone"

stream:
  shardCount: 96
  sendChannelSize: 65536
  batchPush: false

protection:
  maxFrameSize: 4194304
  maxFrameBufSize: 4194304
  maxWSFrameSize: 4194304
  maxWSBufferSize: 4194304
  cpuThreshold: 92
  dropOnOverload: true
  checkIntervalMs: 200
  wsHeartbeatTimeout: 60
  wsCheckInterval: 30
  connCheckInterval: "5m"
  connIdleTimeout: "30s"
  preAuthCommands: [1000001]

security:
  enabled: true
  rateLimit:
    enabled: true
    maxTokens: 1000000
    tokenRefresh: "1s"
  circuitBreaker:
    enabled: false

# 压测：必须关闭登录校验（AGENTS.md Benchmarks）
loginValidation:
  enabled: false

waf:
  enabled: false

perf:
  gcPercent: 300           # GOGC：堆增长 300% 时触发 GC（默认 100）
  memoryLimitPercent: 80   # 软内存上限

pipeline:
  asyncEnabled: false     # A/B 实测：同步 498K > 异步 482K（队列溢出丢弃），保持同步
  workerQueueSize: 262144 # 每分片任务队列（默认 4096 高吞吐下会溢出丢弃）
