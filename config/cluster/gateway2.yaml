# 集群实例 2：环境项（身份/端口/集群开关）；数值默认见 defaults.go。
httpPort: 8082
belong: "default"
serverId: "gateway-2"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]

discovery:
  enabled: true
  registerSelf: true

transports:
  - protocol: tcp
    port: 48090
  - protocol: tcp
    port: 48091
    type: websocket

grpc:
  port: 50052
  windowSize: 67108864

monitoring:
  pprofAddr: "127.0.0.1:6061"
  disableMetricsLog: true   # 线上关闭每秒 metrics 日志

security:
  enabled: true
  rateLimit:
    enabled: true
    maxTokens: 1000000    # 集群联调：高限额避免干扰
  circuitBreaker:
    enabled: false

# 集群联调默认关闭登录校验；生产应设 true
loginValidation:
  enabled: false

waf:
  enabled: false
