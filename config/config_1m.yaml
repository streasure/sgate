# sgate 百万连接配置
# 适用于 1M 并发连接压测
port: 8081
logLevel: error    # 压测时用 error 减少日志开销
serverId: "gateway-1m"
serverType: "Gateway"
zone: "default"

etcd:
  enabled: false   # 压测不需要 etcd

discovery:
  enabled: false

transports:
  - protocol: tcp
    port: 48080
  - protocol: tcp
    port: 48081
    type: websocket
  # 多端口支持百万连接（每端口 ~6K 来自 localhost）
  - protocol: tcp
    port: 49000
  - protocol: tcp
    port: 49001
  - protocol: tcp
    port: 49002
  - protocol: tcp
    port: 49003
  - protocol: tcp
    port: 49004
  - protocol: tcp
    port: 49005
  - protocol: tcp
    port: 49006
  - protocol: tcp
    port: 49007
  - protocol: tcp
    port: 49008
  - protocol: tcp
    port: 49009
  - protocol: tcp
    port: 49010
  - protocol: tcp
    port: 49011
  - protocol: tcp
    port: 49012
  - protocol: tcp
    port: 49013
  - protocol: tcp
    port: 49014
  - protocol: tcp
    port: 49015
  - protocol: tcp
    port: 49016
  - protocol: tcp
    port: 49017
  - protocol: tcp
    port: 49018
  - protocol: tcp
    port: 49019
  - protocol: tcp
    port: 49020
  - protocol: tcp
    port: 49021
  - protocol: tcp
    port: 49022
  - protocol: tcp
    port: 49023
  - protocol: tcp
    port: 49024
  - protocol: tcp
    port: 49025
  - protocol: tcp
    port: 49026
  - protocol: tcp
    port: 49027
  - protocol: tcp
    port: 49028
  - protocol: tcp
    port: 49029
  - protocol: tcp
    port: 49030
  - protocol: tcp
    port: 49031
  - protocol: tcp
    port: 49032
  - protocol: tcp
    port: 49033
  - protocol: tcp
