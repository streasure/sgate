  - protocol: tcp
    port: 49035
  - protocol: tcp
    port: 49036
  - protocol: tcp
    port: 49037
  - protocol: tcp
    port: 49038
  - protocol: tcp
    port: 49039
  - protocol: tcp
    port: 49040
  - protocol: tcp
    port: 49041
  - protocol: tcp
