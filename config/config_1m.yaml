grpc:
  port: 50051
  windowSize: 67108864

monitoring:
  pprofAddr: ":6060"

cluster:
  enabled: false
  mode: "standalone"

stream:
  shardCount: 128
  sendChannelSize: 1048576

protection:
  maxFrameSize: 4194304
  maxFrameBufSize: 65536        # 64KB，降低百万连接内存
  maxWSFrameSize: 4194304
  maxWSBufferSize: 65536
  maxConnections: 1200000       # 百万连接 + 20% 余量
  maxConnectionsPerIP: 0        # 压测不限单 IP
  cpuThreshold: 95
  dropOnOverload: true
  checkIntervalMs: 200
  wsHeartbeatTimeout: 120
  wsCheckInterval: 30
  connCheckInterval: "10m"
  connIdleTimeout: "10m"        # 压测时放宽空闲超时
  preAuthCommands: [1000001]

security:
  enabled: false   # 压测关闭安全组件

waf:
  enabled: false
