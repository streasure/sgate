# sgate 百万连接配置
# 适用于 1M 并发连接压测
httpPort: 8081
belong: "default"
serverId: "gateway-1m"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]

discovery:
  enabled: false

transports:
  - port: 48080
  - port: 48081
    type: websocket
  # 多端口支持百万连接（每端口 ~6K 来自 localhost）
  - port: 49000
  - port: 49001
  - port: 49002
  - port: 49003
  - port: 49004
  - port: 49005
  - port: 49006
  - port: 49007
  - port: 49008
  - port: 49009
  - port: 49010
  - port: 49011
  - port: 49012
  - port: 49013
  - port: 49014
  - port: 49015
  - port: 49016
  - port: 49017
  - port: 49018
  - port: 49019
  - port: 49020
  - port: 49021
  - port: 49022
  - port: 49023
  - port: 49024
  - port: 49025
  - port: 49026
  - port: 49027
  - port: 49028
  - port: 49029
  - port: 49030
  - port: 49031
  - port: 49032
  - port: 49033
  - port: 49034
  - port: 49035
  - port: 49036
  - port: 49037
  - port: 49038
  - port: 49039
  - port: 49040
  - port: 49041
  - port: 49042
  - port: 49043
  - port: 49044
  - port: 49045
  - port: 49046
  - port: 49047
  - port: 49048
  - port: 49049
  - port: 49050

grpc:
  port: 50051
  windowSize: 67108864

monitoring:
  pprofAddr: "127.0.0.1:6060"
  disableMetricsLog: true   # 百万连接压测关闭每秒 metrics 日志

stream:
  shardCount: 128
  sendChannelSize: 1048576

protection:
  maxFrameSize: 65532        # 必须 <= maxFrameBufSize-4，否则大帧静默断连（Validate 强制）
  maxFrameBufSize: 65536        # 64KB，降低百万连接内存
  maxWSFrameSize: 65522        # 必须 <= maxWSBufferSize-14
  maxWSBufferSize: 65536
  maxConnections: 1200000       # 百万连接 + 20% 余量
  maxConnectionsPerIP: 0        # 压测不限单 IP
  cpuThreshold: 95
  dropOnOverload: true
  checkIntervalMs: 200
  wsHeartbeatTimeout: 120
  wsCheckInterval: 30
  connCheckInterval: "10m"
  connIdleTimeout: "10m"        # 压测时放宽空闲超时
  preAuthCommands: [1000001]

security:
  enabled: false   # 压测关闭安全组件

# 压测：必须关闭登录校验
loginValidation:
  enabled: false

waf:
  enabled: false
