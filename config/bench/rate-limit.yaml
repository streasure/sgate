# 压测（限流下扫）：环境项 + 压测差异；数值默认见 defaults.go。
# Bench 规则见 AGENTS.md：loginValidation 必须 false，禁 login HTTP API。
httpPort: 8081
belong: "default"
serverId: "gateway-1"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]

discovery:
  enabled: true
  registerSelf: true

transports:
  - protocol: tcp
    port: 48080
  - protocol: tcp
    port: 48081
    type: websocket

grpc:
  port: 50051
  windowSize: 67108864

monitoring:
  pprofAddr: "127.0.0.1:6060"
  disableTracer: true   # 压测关闭分布式追踪（避免每消息 Span 分配）
  disableMetricsLog: true   # 压测关闭每秒 metrics 日志


stream:
  batchPush: false

protection:
  benchMode: true       # 压测模式：关闭过载检查/WS心跳/连接空闲检查等后台周期任务
  cpuThreshold: 92
  dropOnOverload: true

security:
  enabled: true
  rateLimit:
    enabled: true       # 限流下扫：开启且限额拉高避免热路径每消息做限流检查干扰测量
    maxTokens: 2000000
  circuitBreaker:
    enabled: false

# 压测：必须关闭登录校验（AGENTS.md Benchmarks）
loginValidation:
  enabled: false

waf:
  enabled: false

pipeline:
  asyncEnabled: false     # A/B 实测：同步 498K > 异步 482K（队列溢出丢弃），保持同步
  workerQueueSize: 262144 # 覆盖默认 65536；仅异步模式生效
