# 压测（batch 开启）：环境项 + 压测差异；数值默认见 defaults.go。
# Bench 规则见 AGENTS.md：loginValidation 必须 false，禁 login HTTP API。
httpPort: 8081
belong: "default"
serverId: "gateway-1"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]

discovery:
  registerSelf: true

transports:
  - port: 48080
  - port: 48081
    type: websocket

grpc:
  port: 50051
  windowSize: 67108864

monitoring:
  pprofAddr: "127.0.0.1:6060"
  disableTracer: true   # 压测关闭分布式追踪（避免每消息 Span 分配）
  disableMetricsLog: true   # 压测关闭每秒 metrics 日志
  disableWSHeartbeatCheck: true  # 压测关闭 WS 心跳超时清理
  disableConnectionChecker: true  # 压测关闭连接空闲检查


stream:
  batchPush: true       # 本组压测差异：开启 batch 推送

protection:
  cpuThreshold: 92
  dropOnOverload: false  # 压测旁路过载拦截（cpu/mem 采样与 /stats 展示保留）

security:
  enabled: true
  rateLimit:
    enabled: false      # 压测关闭限流：避免热路径每消息做限流检查，干扰转发吞吐测量
  circuitBreaker:
    enabled: false

# 压测：必须关闭登录校验（AGENTS.md Benchmarks）
loginValidation:
  enabled: false

waf:
  enabled: false

pipeline:
  asyncEnabled: false      # A/B 实测：同步 498K > 异步 482K；「全开」仅指 batch 系列开关
  workerQueueSize: 262144  # 覆盖默认 65536；仅异步模式生效
