httpPort: 8082
belong: "default"
serverId: "gateway-2"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

discovery:
  enabled: true
  serviceName: "logic"
  zone: "default"
  registerSelf: true

transports:
  - protocol: tcp
    port: 48090
  - protocol: tcp
    port: 48091
    type: websocket

grpc:
  port: 50052
  windowSize: 67108864

monitoring:
  pprofAddr: ":6061"
  disableMetricsLog: true   # 线上关闭每秒 metrics 日志

configCenter:
  enabled: false

cluster:
  enabled: true
  mode: "cluster"

stream:
  shardCount: 96
  sendChannelSize: 1048576

protection:
  maxFrameSize: 4194304
  maxFrameBufSize: 4194304
  maxWSFrameSize: 4194304
  maxWSBufferSize: 4194304
  cpuThreshold: 92
  dropOnOverload: true
  checkIntervalMs: 200
  wsHeartbeatTimeout: 60
  wsCheckInterval: 30
  connCheckInterval: "5m"
  connIdleTimeout: "30s"
  preAuthCommands: [1000001]

security:
  enabled: true
  rateLimit:
    enabled: true
    maxTokens: 1000000
    tokenRefresh: "1s"
  circuitBreaker:
    enabled: false

# 集群联调默认关闭登录校验；生产应设 true
loginValidation:
  enabled: false

waf:
  enabled: false
