port: 8082
logLevel: warn
belong: "default"
serverId: "gateway-2"
serverType: "Gateway"
zone: "default"

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

discovery:
  enabled: true
  serviceName: "logic"
  zone: "default"
  registerSelf: true

logicServerType: "Logic"

transports:
  - protocol: tcp
    port: 48090
  - protocol: tcp
    port: 48091
    type: websocket

grpc:
  port: 50052
  windowSize: 67108864

monitoring:
  pprofAddr: ":6061"
  prometheus:
    enabled: false
    addr: ":9102"
    path: "/metrics"
    prefix: "app"
  maxMessageSize: 8388608

configCenter:
  enabled: false

cluster:
  enabled: true
  mode: "cluster"

stream:
  shardCount: 96
  sendChannelSize: 1048576
  receiveBatchSize: 128

protection:
  maxFrameSize: 4194304
  maxFrameBufSize: 4194304
  maxWSFrameSize: 4194304
  maxWSBufferSize: 4194304
  memoryThreshold: 92
  cpuThreshold: 92
  dropOnOverload: true
  checkIntervalMs: 200
  wsHeartbeatTimeout: 60
  wsCheckInterval: 30
  connCheckInterval: "5m"
  connIdleTimeout: "30s"
  preAuthCommands: [1000001]

security:
  enabled: true
  rateLimit:
    enabled: true
    maxTokens: 1000000
    tokenRefresh: "1s"
  circuitBreaker:
    enabled: false

waf:
  enabled: false
