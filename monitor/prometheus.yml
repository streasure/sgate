# ============================================================================
# Prometheus 抓取配置（Windows 本地原生安装版，使用默认端口）
# ----------------------------------------------------------------------------
# 作用：告诉 Prometheus 去 sgate 的 /metrics 端点拉取指标
#
# 端口规划（全部使用默认端口，无需任何 --web.listen-address 参数）：
#   sgate metrics :9100  ← sgate config.yaml 中 monitoring.prometheus.addr
#   Prometheus    :9090  ← Prometheus 自身默认
#   Grafana       :3000  ← Grafana 自身默认
#
# 启动方式（Windows 本地安装的 prometheus.exe）：
#   prometheus.exe ^
#     --config.file=e:\sgate\monitor\prometheus.yml ^
#     --storage.tsdb.path=e:\sgate\monitor\prometheus-data
#
# 注意：
#   - Prometheus 自身默认端口 9090，sgate metrics 让出到 9100，互不冲突
#   - storage.tsdb.path 必须指向已存在的目录（手动创建 prometheus-data 文件夹）
#   - Windows 下 prometheus.exe 从 https://prometheus.io/download/ 下载
#   - sgate config.yaml 中 monitoring.prometheus.enabled 必须为 true
# ============================================================================

global:
  scrape_interval: 5s          # 抓取间隔（按需调整，压测时可降到 1s）
  evaluation_interval: 10s     # 告警规则评估间隔
  external_labels:
    monitor: 'sgate-monitor'

scrape_configs:
  # sgate 网关指标
  - job_name: 'sgate'
    scrape_interval: 5s
    metrics_path: '/metrics'  # 必须与 sgate config.yaml 的 monitoring.prometheus.path 一致
    static_configs:
      - targets: ['127.0.0.1:9100']   # sgate 的 Prometheus 指标端点（让出 9090 给 Prometheus）
        labels:
          service: 'sgate'
          zone: 'default'
