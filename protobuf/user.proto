syntax = "proto3";

package sgate.protobuf;

option go_package = "./protobuf";

message UserInfo {
    string                          uuid                      = 1;
    string                          nickName                  = 2;
    int32                           curAvatarId               = 3;  // 当前头像id 为0则没有头像
    map<int32, int64>               items                     = 4;  // 道具包裹
}