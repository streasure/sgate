syntax = "proto3";

package sgate.protobuf;

option go_package = "./protobuf";

import "message.proto";

// GatewayService 网关服务
service GatewayService {
  // StreamMessages 流式消息处理
  rpc StreamMessages (stream StreamData) returns (stream StreamData);
  // SendMessage 发送单条消息
  rpc SendMessage (StreamData) returns (StreamData);
}
